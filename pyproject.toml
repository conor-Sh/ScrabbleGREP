[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrabblegrep"
version = "0.1.0"
description = "grep-like searching of a Scrabble lexicon"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "scrabblegrep contributors" }
]

[project.scripts]
scrabblegrep = "scrabblegrep:main"

[tool.setuptools]
py-modules = ["scrabblegrep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
